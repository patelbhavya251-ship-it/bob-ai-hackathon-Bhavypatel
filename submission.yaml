submission:
  title: "ShipGuard AI"

  problem_statement: >
    Supply chain disruptions such as bad weather, port strikes, traffic,
    and geopolitical events can cause shipment delays and increase costs.
    Logistics teams often struggle to quickly identify affected shipments
    and choose suitable alternative routes, which can lead to delivery
    delays, inefficient fleet usage, and financial losses. Our project aims
    to help logistics teams make faster and smarter decisions during such
    disruptions.

  solution_summary: >
    ShipGuard AI is a logistics assistant that analyzes shipment delay,
    temperature, and disruption data to identify shipments at risk. It
    calculates a risk score, classifies the shipment as LOW, MEDIUM, or HIGH,
    and provides recommendations such as rerouting or contacting an
    alternate carrier.

  key_features:
    - "Shipment Risk Detection: Identifies shipments affected by disruptions."
    - "Disruption Analysis: Analyzes events such as port strikes, storms, road blocks, and carrier delays."
    - "Risk Scoring: Calculates a risk score based on delay, temperature, and disruption."
    - "Risk Classification: Classifies shipments as LOW, MEDIUM, or HIGH risk."
    - "Action Recommendations: Suggests actions such as rerouting or using an alternate carrier."

  tech_stack:
    languages:
      - "C++"
    frameworks:
      - "C++ Standard Library"
    ibm_technologies: []
    databases: []
    other:
      - "Git"
      - "GitHub"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    We are most proud of building a simple logistics decision-support
    prototype that identifies shipment risks and provides practical
    recommendations. The project focuses on helping logistics teams make
    faster and smarter decisions during supply chain disruptions.

  known_limitations: >
    - The current prototype uses sample shipment and disruption data.
    - Route recommendations are based on predefined logic and do not represent
      real-time traffic or weather conditions.
    - The C++ prototype is designed as a demonstration and is not yet connected
      to production logistics systems.

